name: Sync upstream formal-conjectures

# Monthly: re-read the 120 existing records from google-deepmind/formal-conjectures
# and open (or refresh) a pull request. Never merges anything.
# Also runs when the sync code itself changes on main, so a change is tested right away.
on:
  schedule:
    - cron: '17 3 1 * *' # 03:17 UTC on the 1st of each month
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/sync-upstream.yml
      - scripts/sync-formal-conjectures.py
      - adapters/formal_conjectures.py

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: npm ci
      - run: python -m pip install -r requirements-adapters.txt

      - name: Fetch latest upstream
        run: git clone --depth 1 https://github.com/google-deepmind/formal-conjectures "$RUNNER_TEMP/formal-conjectures"

      - name: Sync records
        id: sync
        run: |
          python scripts/sync-formal-conjectures.py \
            --source "$RUNNER_TEMP/formal-conjectures" \
            --report "$RUNNER_TEMP/sync-report.md"
          npx tsx scripts/build-dedup-report.ts
          head -n 1 "$RUNNER_TEMP/sync-report.md" | sed 's/CHANGED=/changed=/' >> "$GITHUB_OUTPUT"
          echo "month=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"

      - name: Run checks on synced data
        if: steps.sync.outputs.changed == 'yes'
        run: |
          body="$RUNNER_TEMP/pr-body.md"
          tail -n +3 "$RUNNER_TEMP/sync-report.md" > "$body"
          set +e
          npm run check > "$RUNNER_TEMP/check.log" 2>&1; check=$?
          python -m unittest discover -s adapters -p 'test_*.py' > "$RUNNER_TEMP/adapters.log" 2>&1; adapters=$?
          npm audit --audit-level=moderate > "$RUNNER_TEMP/audit.log" 2>&1; audit=$?
          set -e
          result() { if [ "$1" = 0 ]; then echo "PASS"; else echo "**FAIL** (exit $1)"; fi; }
          {
            echo "## Checks run by the sync job"
            echo
            echo "PRs opened by GitHub Actions do not trigger the normal CI, so the sync job ran these itself:"
            echo
            echo "- \`npm run check\` (data validators, lint, typecheck, unit tests, build): $(result $check)"
            echo "- adapter unit tests: $(result $adapters)"
            echo "- \`npm audit --audit-level=moderate\`: $(result $audit)"
            echo
            echo "Run log: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          } >> "$body"
          tail -n 40 "$RUNNER_TEMP/check.log"

      - name: Open or update pull request
        if: steps.sync.outputs.changed == 'yes'
        uses: peter-evans/create-pull-request@v7
        with:
          branch: sync/formal-conjectures
          delete-branch: true
          add-paths: data
          commit-message: 'data: sync formal-conjectures upstream (${{ steps.sync.outputs.month }})'
          title: 'Sync formal-conjectures upstream (${{ steps.sync.outputs.month }})'
          body-path: ${{ runner.temp }}/pr-body.md
